<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8fb"><title>봄이 · 진료 상세기록</title>
<style>
:root{--ink:#523b46;--muted:#8d7580;--pink:#b85f82;--mint:#e5faf5;--line:#efdde5;--shadow:0 12px 28px #a15a7a13}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:radial-gradient(circle at 10% 3%,#ffe2eb9a,transparent 25%),radial-gradient(circle at 92% 22%,#d7f8f0a8,transparent 27%),#fffafd;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;line-height:1.6}a{color:inherit}.wrap{width:min(100% - 28px,670px);margin:auto;padding:22px 0 70px}.back{display:inline-flex;gap:7px;align-items:center;text-decoration:none;color:#8d4964;font-size:13px;font-weight:800;padding:8px 0}.hero{margin-top:10px;padding:26px 22px;background:linear-gradient(135deg,#fff,#fff2f7 65%,#e9faf6);border:1px solid white;border-radius:27px;box-shadow:var(--shadow)}.eyebrow{font-size:12px;letter-spacing:.03em;color:#b26481;font-weight:850}.hero h1{font-size:clamp(25px,6vw,34px);line-height:1.3;letter-spacing:-.035em;margin:12px 0 8px;overflow-wrap:anywhere;word-break:keep-all}.sub{color:var(--muted);font-size:13px}.signal{margin-top:13px;background:var(--mint);padding:11px 13px;border-radius:14px;font-size:13px;font-weight:750;color:#267468;overflow-wrap:anywhere;word-break:keep-all}.one{margin:12px 0 0;font-size:14px;color:#775967;word-break:keep-all;overflow-wrap:anywhere}.layout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.card{min-width:0;padding:18px;background:#fff;border:1px solid var(--line);border-radius:21px;box-shadow:0 8px 22px #a15a7a0d;overflow-wrap:anywhere;word-break:keep-all}.full{grid-column:1/-1}.card h2{font-size:18px;line-height:1.4;letter-spacing:-.025em;margin:0 0 13px}.lbl{font-size:12px;font-weight:800;color:var(--muted);line-height:1.5}.val{font-size:clamp(17px,4.4vw,23px);font-weight:850;line-height:1.4;margin-top:6px;overflow-wrap:anywhere;word-break:keep-all}.note{color:var(--muted);font-size:12px;line-height:1.6;margin-top:6px}.body{color:#674e5a;font-size:14px;white-space:pre-line;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere}.line{border-top:1px solid var(--line);padding:12px 0;font-size:14px}.line:first-of-type{border-top:0}.line strong{display:block;font-size:14px}.line p{margin:4px 0 0;color:#674e5a}.statusline{display:grid;grid-template-columns:minmax(100px,36%) minmax(0,1fr);gap:12px;border-top:1px solid var(--line);padding:11px 0;font-size:13px}.statusline:first-of-type{border-top:0}.statusline .answer{text-align:right;font-weight:700;overflow-wrap:anywhere;word-break:keep-all}.btn{display:flex;align-items:center;justify-content:center;padding:12px 13px;min-height:45px;border:1px solid #f0cad9;border-radius:14px;text-decoration:none;text-align:center;font-size:13px;font-weight:850;color:#90516a;background:linear-gradient(125deg,#ffe9f1,#e7faf6);margin-top:12px}.video{width:100%;aspect-ratio:16/9;border:0;border-radius:15px;background:#44323d;display:block}.clip{width:100%;display:block;border-radius:15px;background:#44323d;max-height:500px}.mediaBox+.mediaBox{border-top:1px solid var(--line);margin-top:17px;padding-top:17px}.mediaTitle{font-weight:850;margin-bottom:11px;font-size:14px}.check{padding:9px 0;border-top:1px solid var(--line);display:flex;gap:9px;align-items:flex-start;font-size:13px}.check:before{content:'□';font-size:17px;color:#b78096;line-height:1.3}.warning{background:#fff8e8;color:#805d27;padding:13px 14px;border-radius:14px;font-size:13px;line-height:1.7;white-space:pre-line}.timeline{border-left:2px solid #f2c0d2;margin-left:7px;padding-left:17px}.step{position:relative;padding:0 0 15px;font-size:13px}.step:before{content:'';position:absolute;left:-23px;top:6px;width:9px;height:9px;background:#eaa9c1;border-radius:50%}.step b{display:block;font-size:14px}.step:last-child{padding-bottom:0}.muted{color:var(--muted)}.footer{text-align:center;font-size:11px;color:#ab8f9d;margin-top:23px}.loading{padding:15px 4px;color:var(--muted);font-size:13px}.hidden{display:none!important}@media(max-width:360px){.layout{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:15px}.hero{padding:21px 17px}}@media(min-width:700px){.wrap{padding-top:32px}.layout{gap:15px}.card{padding:21px}}
</style></head><body><main class="wrap"><a class="back" href="../records.html">← 전체 진료기록</a><header class="hero"><div class="eyebrow">🌸 BOMI · 진료 상세기록</div><h1 id="title">진료기록을 불러오는 중</h1><div id="subtitle" class="sub">기록을 확인하고 있습니다.</div><div id="signal" class="signal hidden"></div><p id="one" class="one"></p></header><div id="content" class="layout"><div class="loading">진료 내용과 영상 연결을 확인하고 있습니다.</div></div><a href="../index.html" class="btn">🏠 메인화면으로 돌아가기</a><div class="footer">봄이스토리 · 의료정보는 원본 결과지와 의료진 설명을 우선합니다.</div></main>
<script>
(()=>{'use strict';
const API='https://bomi-v4.jinihori.workers.dev/api/public/state';const date=new URLSearchParams(location.search).get('date');const host=document.querySelector('#content');
const knownVideos={'2026-09-18':[{id:'1R5afrZmttURE-dTvBb5qcZVbOWtBzjGW',title:'9월 18일 초음파 영상'}],'2026-10-17':[{id:'19Qd63HdJwUfPDpaUvsn_vMXgrLxG1tnQ',title:'28주 입체초음파 영상'}],'2026-10-31':[{id:'1QXe025AXqQ3U8H5rWrlVchN0mcUAHCyu',title:'30주 초음파 영상'}]};
const legacyDates=new Set(['2026-06-08','2026-06-25','2026-07-22']);
const iconMap={baby:'👶',activity:'📏',heart:'❤️','heart-pulse':'💗',ruler:'📏',droplets:'💧','map-pin':'📍',calendar:'📅','calendar-days':'📅',hospital:'🏥',stethoscope:'🩺',pill:'💊',weight:'⚖️',scale:'⚖️',eye:'👁️',check:'✅'};
const txt=(v,def='')=>v===null||v===undefined||v===''?def:String(v);const el=(tag,cl,t)=>{const e=document.createElement(tag);if(cl)e.className=cl;if(t!==undefined)e.textContent=txt(t);return e};const add=(p,...children)=>{children.forEach(c=>p.append(c));return p};const card=(title)=>{const p=el('section','card full');if(title)p.append(el('h2','',title));host.append(p);return p};const koDate=s=>txt(s).replaceAll('-','.');
function link(parent,url,label){const a=el('a','btn',label);a.href=url;a.target='_blank';a.rel='noopener noreferrer';parent.append(a);return a}
function mediaEntries(r){const list=[];const seen=new Set();function collect(u,title){if(!u)return;let url;try{url=new URL(String(u))}catch{return}if(!['http:','https:'].includes(url.protocol))return;const m=url.href.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);const id=m?m[1]:url.searchParams.get('id')&&url.hostname==='drive.google.com'?url.searchParams.get('id'):'';const key=id?'drive:'+id:url.href;if(seen.has(key))return;seen.add(key);list.push({url:url.href,id,title})}for(const entry of knownVideos[r.visit_date]||[])collect('https://drive.google.com/file/d/'+entry.id+'/view',entry.title);if(r.video_url)collect(r.video_url,'진료기록에 보관된 초음파 영상');return list}
function showVideo(r){const videos=mediaEntries(r);if(!videos.length)return;const p=card('🎬 초음파 영상');for(const v of videos){const box=el('div','mediaBox');box.append(el('div','mediaTitle',v.title));if(v.id){const f=el('iframe','video');f.src='https://drive.google.com/file/d/'+encodeURIComponent(v.id)+'/preview';f.title=v.title;f.loading='lazy';f.allow='autoplay; fullscreen; encrypted-media';f.allowFullscreen=true;box.append(f);link(box,'https://drive.google.com/file/d/'+encodeURIComponent(v.id)+'/view','Google Drive에서 원본 영상 열기')}else if(/\.(mp4|webm|ogg|mov)(?:[?#]|$)/i.test(v.url)){const a=el('video','clip');a.src=v.url;a.controls=true;a.playsInline=true;a.preload='metadata';box.append(a);link(box,v.url,'원본 영상 열기')}else{link(box,v.url,'원본 영상 보기')}box.append(el('div','note','재생이 안 되면 원본 링크를 열어 주세요. 접근 여부는 영상 공유 권한에 따라 달라집니다.'));p.append(box)}}
function showPhoto(r){if(r.visit_date!=='2026-10-17')return;const p=card('📸 입체초음파 사진첩');const f=el('iframe','video');f.src='https://drive.google.com/file/d/1T0rdGqYnUQS1DS2eoggIHHJMjvyZBHOl/preview';f.title='10월 17일 입체초음파 사진 09분 56초';f.loading='lazy';p.append(f);link(p,'https://drive.google.com/file/d/1T0rdGqYnUQS1DS2eoggIHHJMjvyZBHOl/view','09분 56초 사진 원본 열기');link(p,'https://drive.google.com/drive/folders/1qTaSQ7OeEy6p10KoNKm1cmgN8OOikDZD','봄이 사진 폴더 열기');p.append(el('div','note','사진 4장 중 개별 Drive 주소가 확인된 사진 1장만 미리보기로 연결했습니다. 다른 3장의 개별 주소는 확인이 필요합니다.'))}
function showMetrics(items){if(!Array.isArray(items)||!items.length)return;for(const item of items.slice(0,12)){const p=el('div','card');p.append(el('div','lbl',item.icon?(iconMap[item.icon]||'📌')+' '+txt(item.label):txt(item.label)));p.append(el('div','val',txt(item.value,'-')));if(item.note)p.append(el('div','note',item.note));host.append(p)}}
function showSection(s){const p=card(s.title||'상세 기록');if(s.note)p.append(el('div','note',s.note));if(s.text)p.append(el('div',s.type==='notice'?'warning':'body',s.text));if(Array.isArray(s.paragraphs))for(const t of s.paragraphs){const x=el('p','body',t);p.append(x)}if(s.type==='timeline'){const line=el('div','timeline');for(const it of s.items||[]){const x=el('div','step');x.append(el('div','lbl',[it.date,it.when].filter(Boolean).join(' · ')),el('b','',it.title||it.label||'일정'));if(it.description||it.note)x.append(el('div','body',it.description||it.note));line.append(x)}p.append(line)}else if(s.type==='checklist'){for(const it of s.items||[])p.append(el('div','check',typeof it==='string'?it:it.text||it.label||'확인'))}else if(s.type==='qa'){for(const it of s.items||[]){const x=el('div','line');x.append(el('strong','',it.question||it.q||'상담'),el('p','body',it.answer||it.a||''));p.append(x)}}else if(s.type==='status'){for(const it of s.items||[]){const x=el('div','statusline');x.append(el('span','',it.label||'항목'),el('span','answer',it.value||'-'));p.append(x);if(it.note)p.append(el('div','note',it.note))}}else if(s.type==='notice'){for(const it of s.items||[]){p.append(el('div','warning',typeof it==='string'?it:it.text||it.description||it.label||''))}}else if(Array.isArray(s.items)){for(const it of s.items||[])p.append(el('div','body',typeof it==='string'?it:it.text||it.description||it.value||''))}}
function render(r){document.title=koDate(r.visit_date)+' · 봄이 진료기록';document.querySelector('#title').textContent=r.report?.title||r.title||'진료 상세기록';document.querySelector('#subtitle').textContent=[koDate(r.visit_date),Number.isFinite(Number(r.gestation_week))?`${r.gestation_week}주 ${r.gestation_day||0}일`:'',r.hospital].filter(Boolean).join(' · ');const signal=txt(r.report?.signal||r.report?.overall_status);if(signal){const x=document.querySelector('#signal');x.textContent=signal;x.classList.remove('hidden')}document.querySelector('#one').textContent=txt(r.report?.one_line||r.summary);host.replaceChildren();
// Put all dated videos near the top so they are never buried below long medical notes.
showVideo(r);showPhoto(r);
const report=r.report&&typeof r.report==='object'?r.report:{};if(report.executive_summary){const p=card('진료 핵심 요약');p.append(el('div','body',report.executive_summary))}showMetrics(Array.isArray(report.metrics)&&report.metrics.length?report.metrics:r.metrics);
if(Array.isArray(report.sections)&&report.sections.length){report.sections.forEach(showSection)}else{if(r.details){const p=card('상세 기록');p.append(el('div','body',r.details))}if(r.next_schedule){const p=card('진료 일정');p.append(el('div','body',r.next_schedule))}if(Array.isArray(r.checklist)&&r.checklist.length)showSection({type:'checklist',title:'체크리스트',items:r.checklist})}
if(legacyDates.has(r.visit_date)){const p=card('원본 정식 리포트');p.append(el('div','body','기존에 제작된 정식 리포트는 삭제하지 않고 그대로 보관합니다.'));link(p,'./'+r.visit_date+'.html','기존 정식 리포트 열기')}
}
async function load(){if(!/^\d{4}-\d{2}-\d{2}$/.test(date||''))throw new Error('진료 날짜가 올바르지 않습니다.');const response=await fetch(API+'?t='+Date.now(),{cache:'no-store',headers:{Accept:'application/json'}});if(!response.ok)throw new Error('진료기록 서버에 연결하지 못했습니다.');const state=await response.json();const r=(Array.isArray(state.records)?state.records:[]).find(x=>x.visit_date===date);if(!r)throw new Error('해당 날짜의 진료기록을 찾을 수 없습니다.');render(r)}load().catch(e=>{host.replaceChildren();const c=card('기록을 열 수 없습니다');c.append(el('div','warning',e.message));link(c,'../records.html','전체 진료기록으로 돌아가기')})
})();
</script></body></html>
