<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8fb"><title>봄이 · 진료 상세기록</title><style>
:root{--ink:#533d49;--muted:#907885;--line:#eedce5;--pink:#ae607f;--mint:#e7faf5}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 8% 0%,#ffe3eea8,transparent 28%),radial-gradient(circle at 92% 20%,#d8f7eead,transparent 31%),#fffbfd;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;line-height:1.6}a{color:inherit}.wrap{width:min(calc(100% - 28px),700px);margin:auto;padding:23px 0 65px}.back{color:#995471;display:inline-flex;padding:7px 0;font-size:13px;font-weight:850;text-decoration:none}.hero{margin:12px 0 15px;background:linear-gradient(130deg,#fff,#fff0f6,#ecfbf7);border:1px solid white;border-radius:27px;padding:26px 22px;box-shadow:0 13px 30px #a15a7a16}.eyebrow{font-size:12px;color:#ae6581;font-weight:850}.hero h1{font-size:clamp(24px,6vw,34px);letter-spacing:-.035em;line-height:1.3;margin:12px 0 7px;word-break:keep-all;overflow-wrap:anywhere}.sub,.note{font-size:12px;color:var(--muted);line-height:1.6}.signal{margin-top:12px;background:var(--mint);color:#25786b;border-radius:13px;padding:11px 13px;font-size:13px;font-weight:750;word-break:keep-all;overflow-wrap:anywhere}.one{font-size:14px;color:#735766;word-break:keep-all;overflow-wrap:anywhere}.layout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{min-width:0;background:#fff;border:1px solid var(--line);padding:18px;border-radius:20px;box-shadow:0 7px 18px #a15a7a0a;word-break:keep-all;overflow-wrap:anywhere}.full{grid-column:1/-1}.card h2{margin:0 0 13px;font-size:18px;letter-spacing:-.03em}.lbl{font-size:12px;font-weight:850;color:var(--muted)}.val{font-size:clamp(18px,4.7vw,23px);font-weight:900;line-height:1.4;margin-top:5px;overflow-wrap:anywhere}.body{font-size:14px;line-height:1.8;color:#6c5360;white-space:pre-line;overflow-wrap:anywhere}.note{margin-top:7px}.linkBtn{display:flex;align-items:center;justify-content:center;padding:13px 12px;min-height:44px;text-align:center;background:linear-gradient(120deg,#ffebf1,#e7faf5);border:1px solid #f2d4e0;border-radius:14px;color:#98516f;text-decoration:none;font-size:13px;font-weight:850;margin-top:12px;word-break:keep-all;overflow-wrap:anywhere}.mediaBox{min-width:0}.mediaBox+.mediaBox{border-top:1px solid var(--line);margin-top:20px;padding-top:18px}.mediaTitle{font-size:15px;font-weight:850;margin:0 0 12px}.youtubeFrame{position:relative;display:block;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:15px;background:#251c26}.youtubeFrame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}.nativePlayer{width:100%;height:auto;max-height:min(65vh,520px);display:block;border-radius:15px;background:#352b31;object-fit:contain}.mediaDescription{font-size:12px;color:#846e79;line-height:1.65;margin:10px 0 0;word-break:keep-all;overflow-wrap:anywhere}.mediaBadge{display:inline-block;background:#e8f8f4;border-radius:99px;padding:4px 9px;font-size:11px;color:#29766a;font-weight:850;margin-bottom:10px}.sourceLinks{margin-top:15px;border-top:1px solid var(--line);padding-top:13px}.sourceLinks summary{cursor:pointer;color:#8c6778;font-size:12px;font-weight:800}.statusRow{display:grid;grid-template-columns:minmax(98px,34%) minmax(0,1fr);gap:14px;border-top:1px solid var(--line);padding:10px 0;font-size:13px}.statusRow:first-of-type{border-top:0}.answer{font-weight:750;text-align:right;overflow-wrap:anywhere}.qa{border-top:1px solid var(--line);padding:12px 0}.qa:first-of-type{border-top:0}.qa strong{display:block;font-size:13px;color:#a65a79}.qa .body{margin-top:5px}.check{border-top:1px solid var(--line);padding:10px 0;font-size:13px;display:flex;gap:10px}.check:before{content:'□';color:#b77792;font-size:18px;line-height:1.2}.warning{padding:13px;border-radius:13px;background:#fff7e5;font-size:13px;color:#805d24;line-height:1.7;white-space:pre-line}.warning+.warning{margin-top:8px}.timeline{border-left:2px solid #f3c2d4;margin-left:7px;padding-left:17px}.step{position:relative;padding-bottom:15px;font-size:13px}.step:last-child{padding-bottom:0}.step:before{content:'';position:absolute;left:-23px;top:7px;width:9px;height:9px;background:#e9acc2;border-radius:50%}.step b{display:block;font-size:14px}.footer{color:#ab91a0;font-size:12px;text-align:center;margin-top:22px}.hidden{display:none}@media(max-width:480px){.card{padding:15px}.hero{padding:23px 19px}}@media(max-width:370px){.layout{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><main class="wrap"><a class="back" href="./archive.html">← 전체 진료기록</a><header class="hero"><div class="eyebrow">🌸 BOMI · 진료 상세기록</div><h1 id="title">진료기록 불러오는 중</h1><div class="sub" id="subtitle"></div><div id="signal" class="signal hidden"></div><p id="one" class="one"></p></header><div class="layout" id="content"><div class="note">기록을 확인하고 있습니다.</div></div><a class="linkBtn" href="../index.html">🏠 봄이스토리 메인으로</a><div class="footer">의료기록은 공식 검사 결과지와 의료진 설명을 우선합니다.</div></main>
<script>
(()=>{'use strict';
const API='https://bomi-v4.jinihori.workers.dev/api/public/state',date=new URLSearchParams(location.search).get('date'),root=document.getElementById('content');
const youtube=Object.freeze({'2026-09-18':{id:'bLCil_E3rX4',title:'9월 18일 초음파'},'2026-09-19':{id:'xY6sIzd7z9s',title:'9월 19일 초음파'},'2026-10-05':{id:'eVQhLotFZ-Q',title:'10월 5일 초음파'},'2026-10-17':{id:'lpb7x7Ps2xI',title:'28주 입체초음파'},'2026-10-31':{id:'sYJH8VxZJwk',title:'30주 초음파'}});
// Earlier Google Drive videos are retained as originals, without broken embedded previews.
const knownDrive=Object.freeze({'2026-09-18':[{id:'1R5afrZmttURE-dTvBb5qcZVbOWtBzjGW',title:'9월 18일 기존 Drive 영상'}],'2026-10-17':[{id:'19Qd63HdJwUfPDpaUvsn_vMXgrLxG1tnQ',title:'10월 17일 Drive 원본'}],'2026-10-31':[{id:'1QXe025AXqQ3U8H5rWrlVchN0mcUAHCyu',title:'10월 31일 Drive 원본'}]});
const legacy=new Set(['2026-06-08','2026-06-25','2026-07-22']);const icons={baby:'👶',activity:'📏',heart:'❤️','heart-pulse':'💗',ruler:'📏',droplets:'💧','map-pin':'📍',calendar:'📅','calendar-days':'📅',hospital:'🏥',stethoscope:'🩺',pill:'💊',weight:'⚖️',scale:'⚖️',eye:'👁️'};
const text=(v,d='')=>v==null||v===''?d:String(v),el=(tag,cl,value)=>{const n=document.createElement(tag);if(cl)n.className=cl;if(value!==undefined)n.textContent=text(value);return n},card=(title)=>{const n=el('section','card full');if(title)n.append(el('h2','',title));root.append(n);return n},ko=s=>text(s).replaceAll('-','.');
function link(to,url,label){const a=el('a','linkBtn',label);a.href=url;a.target='_blank';a.rel='noopener noreferrer';to.append(a);return a}
function originalSources(r){const found=[],seen=new Set();function collect(raw,title){if(!raw)return;let u;try{u=new URL(String(raw),location.href)}catch{return}if(!['http:','https:'].includes(u.protocol))return;const m=u.href.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/),id=m?.[1]||(u.hostname==='drive.google.com'?u.searchParams.get('id'):null),key=id?'drive:'+id:u.href;if(seen.has(key))return;seen.add(key);found.push({url:u.href,id,title})}for(const v of knownDrive[r.visit_date]||[])collect('https://drive.google.com/file/d/'+v.id+'/view',v.title);collect(r.video_url,'기존 진료기록에 저장된 영상');return found}
function showVideos(r){const yt=youtube[r.visit_date],originals=originalSources(r);if(!yt&&!originals.length)return;const c=card('🎬 초음파 영상');if(yt){const box=el('div','mediaBox');box.append(el('div','mediaTitle',yt.title));box.append(el('span','mediaBadge','YouTube · 날짜별 영상'));const frame=el('div','youtubeFrame'),iframe=el('iframe','');iframe.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(yt.id)+'?playsinline=1&rel=0';iframe.title=yt.title+' 재생';iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';iframe.referrerPolicy='strict-origin-when-cross-origin';iframe.allowFullscreen=true;iframe.loading='lazy';frame.append(iframe);box.append(frame);link(box,'https://www.youtube.com/watch?v='+encodeURIComponent(yt.id),'▶ YouTube에서 원본 영상 보기');box.append(el('p','mediaDescription','휴대전화에서 재생이 제한되면 원본 영상 보기를 이용해 주세요.'));c.append(box)}
if(yt&&originals.length){const details=el('details','sourceLinks');details.append(el('summary','','이전 원본 영상 링크 (백업)'));for(const o of originals)link(details,o.url,o.title);c.append(details)}else if(!yt){for(const o of originals){const box=el('div','mediaBox');box.append(el('div','mediaTitle',o.title));if(!o.id&&/\.(mp4|webm|ogg)(?:[?#]|$)/i.test(o.url)){const player=el('video','nativePlayer');player.controls=true;player.playsInline=true;player.preload='metadata';player.src=o.url;box.append(player)}link(box,o.url,o.id?'Google Drive에서 원본 영상 열기':'원본 영상 열기');c.append(box)}}}
function photos(r){if(r.visit_date!=='2026-10-17')return;const c=card('📸 입체초음파 사진첩');c.append(el('div','mediaDescription','09분 56초 사진과 기존 공유 폴더를 열 수 있습니다.'));link(c,'https://drive.google.com/file/d/1T0rdGqYnUQS1DS2eoggIHHJMjvyZBHOl/view','09분 56초 사진 원본 보기');link(c,'https://drive.google.com/drive/folders/1qTaSQ7OeEy6p10KoNKm1cmgN8OOikDZD','봄이 사진 폴더 열기');c.append(el('div','note','나머지 세 사진은 개별 공개 주소가 확인되지 않아 링크를 임의로 만들지 않았습니다.'))}
function metrics(items){if(!Array.isArray(items))return;for(const m of items.slice(0,12)){const c=el('div','card');c.append(el('div','lbl',(m.icon?(icons[m.icon]||'📌')+' ':'')+text(m.label,'검사 항목')),el('div','val',text(m.value,'-')));if(m.note)c.append(el('div','note',m.note));root.append(c)}}
function section(s){if(!s||typeof s!=='object')return;const c=card(s.title||'상세 기록');if(s.note)c.append(el('div','note',s.note));if(s.text)c.append(el('div',s.type==='notice'?'warning':'body',s.text));if(Array.isArray(s.paragraphs))for(const p of s.paragraphs)c.append(el('p','body',p));const items=Array.isArray(s.items)?s.items:[];switch(s.type){case 'status':for(const x of items){const r=el('div','statusRow');r.append(el('div','',x.label||'항목'),el('div','answer',x.value||'-'));c.append(r);if(x.note)c.append(el('div','note',x.note))}break;case 'qa':for(const x of items){const r=el('div','qa');r.append(el('strong','',x.question||x.q||'상담 내용'),el('div','body',x.answer||x.a||''));c.append(r)}break;case 'timeline':{const line=el('div','timeline');for(const x of items){const st=el('div','step');st.append(el('div','lbl',[x.date,x.when].filter(Boolean).join(' · ')),el('b','',x.title||x.label||'일정'));if(x.note||x.description)st.append(el('div','body',x.note||x.description));line.append(st)}c.append(line)}break;case 'checklist':for(const x of items)c.append(el('div','check',typeof x==='string'?x:x.text||x.label||'확인'));break;case 'notice':for(const x of items)c.append(el('div','warning',typeof x==='string'?x:x.text||x.description||x.label||''));break;default:for(const x of items)c.append(el('div','body',typeof x==='string'?x:x.text||x.description||x.value||''))}}
function render(r,videoOnly=false){document.title=ko(r.visit_date)+' · 봄이 진료기록';document.getElementById('title').textContent=videoOnly?'초음파 영상 보관':r.report?.title||r.title||'진료 상세기록';document.getElementById('subtitle').textContent=[ko(r.visit_date),!videoOnly&&Number.isFinite(Number(r.gestation_week))?`${r.gestation_week}주 ${r.gestation_day||0}일`:'',!videoOnly?r.hospital:''].filter(Boolean).join(' · ');const sig=!videoOnly?text(r.report?.signal||r.report?.overall_status):'의료기록이 등록되지 않아 영상만 표시합니다.';if(sig){document.getElementById('signal').textContent=sig;document.getElementById('signal').classList.remove('hidden')}document.getElementById('one').textContent=videoOnly?'이 날짜에는 초음파 영상만 연결되어 있습니다. 검사 결과나 진료 내용은 임의로 추가하지 않았습니다.':text(r.report?.one_line||r.summary);root.replaceChildren();showVideos(r);if(videoOnly)return;photos(r);const rep=r.report&&typeof r.report==='object'?r.report:{};if(rep.executive_summary){const c=card('진료 핵심 요약');c.append(el('div','body',rep.executive_summary))}metrics(Array.isArray(rep.metrics)&&rep.metrics.length?rep.metrics:r.metrics);if(Array.isArray(rep.sections)&&rep.sections.length)rep.sections.forEach(section);else{if(r.details){const c=card('상세 기록');c.append(el('div','body',r.details))}if(r.next_schedule){const c=card('일정 기록');c.append(el('div','body',r.next_schedule))}if(Array.isArray(r.checklist)&&r.checklist.length)section({type:'checklist',title:'체크리스트',items:r.checklist})}if(legacy.has(r.visit_date)){const c=card('기존 정식 리포트');c.append(el('div','body','기존에 별도로 제작한 정식 리포트는 삭제하지 않고 보존했습니다.'));link(c,'./'+r.visit_date+'.html','기존 정식 리포트 열기')}}
async function load(){if(date==='2026-11-10'){location.replace('./2026-11-10.html');return}if(!/^\d{4}-\d{2}-\d{2}$/.test(date||''))throw Error('올바른 진료일을 선택해 주세요.');const res=await fetch(API+'?t='+Date.now(),{cache:'no-store',headers:{Accept:'application/json'}});if(!res.ok)throw Error('진료기록 서버에 연결하지 못했습니다.');const state=await res.json();const r=(Array.isArray(state.records)?state.records:[]).find(v=>v.visit_date===date);if(r)render(r);else if(youtube[date])render({visit_date:date,video_url:''},true);else throw Error('해당 날짜의 진료기록을 찾지 못했습니다.')}load().catch(e=>{root.replaceChildren();const c=card('진료기록을 열 수 없습니다');c.append(el('div','warning',e.message));link(c,'./archive.html','전체 진료기록으로 돌아가기')})
})();
</script></body></html>
