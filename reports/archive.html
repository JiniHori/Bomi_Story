<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff8fb"><title>봄이 · 전체 진료기록</title><style>
:root{--ink:#553d48;--muted:#977d89;--pink:#b45d7e;--line:#f0dae4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,#ffe3ed99,transparent 27%),radial-gradient(circle at 100% 30%,#d8f7ee99,transparent 35%),#fffafd;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.wrap{max-width:700px;margin:auto;padding:22px 16px 72px}a{text-decoration:none;color:inherit}.back{display:inline-flex;padding:8px 0;font-size:13px;font-weight:800;color:#a05370}.hero{margin:12px 0 18px;padding:24px 22px;border:1px solid #fff;background:linear-gradient(140deg,#fff,#fff0f6,#eafbf6);box-shadow:0 12px 30px #ae63831a;border-radius:26px}.hero h1{margin:12px 0 8px;letter-spacing:-.04em;font-size:30px}.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}.count{font-size:12px;font-weight:800;color:#aa6880;margin:16px 3px}.list{display:grid;gap:10px}.visit{display:flex;gap:12px;align-items:center;padding:17px 16px;border:1px solid var(--line);border-radius:19px;background:#fff;box-shadow:0 5px 18px #ae63830c}.visit:focus-visible,.visit:hover{outline:2px solid #efc2d2}.visit>*{min-width:0}.when{font-size:12px;font-weight:900;color:#b66b87;flex:0 0 92px}.copy{flex:1;min-width:0}.title{font-size:15px;font-weight:850;line-height:1.4;word-break:keep-all;overflow-wrap:anywhere}.sub{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}.arrow{color:#b77f97;font-size:20px}.note{font-size:12px;color:var(--muted);line-height:1.6;padding:10px 2px}.footer{text-align:center;margin-top:26px;color:#ac8d9b;font-size:12px}@media(max-width:390px){.visit{padding:15px 12px}.when{flex-basis:71px;font-size:11px}.title{font-size:14px}}
</style></head><body><main class="wrap"><a class="back" href="../index.html">← 봄이스토리 홈</a><header class="hero"><div style="font-weight:900;font-size:12px;color:#a85977">🌸 BOMI RECORDS</div><h1>모든 진료기록</h1><p>진료일을 누르면 검사 결과, 의료진 상담과 해당 날짜의 초음파 영상을 함께 볼 수 있어요. 기존 정식 리포트도 보존되어 있습니다.</p></header><div class="count" id="count">진료기록을 불러오는 중</div><div class="list" id="list" aria-live="polite"></div><p class="note">영상이 연결된 날짜는 상세기록에서 재생하거나 Google Drive 원본을 열 수 있습니다. 기존 기록의 사실관계는 변경하지 않았습니다.</p><div class="footer">봄이스토리 · 날짜별 진료 기록 보관함</div></main>
<script>
(()=>{'use strict';const host=document.querySelector('#list');const count=document.querySelector('#count');const legacy=new Set(['2026-06-08','2026-06-25','2026-07-22']);const knownVideos=new Set(['2026-09-18','2026-10-17','2026-10-31']);const text=v=>v==null?'':String(v);const mk=(tag,cl,str)=>{const n=document.createElement(tag);if(cl)n.className=cl;if(str!==undefined)n.textContent=text(str);return n};function item(date,title,subtitle,hasVideo){const a=mk('a','visit');a.href='./visit.html?date='+encodeURIComponent(date);a.append(mk('div','when',date.replace(/^\d{4}-/,'').replace('-','.')));const c=mk('div','copy');c.append(mk('div','title',title||'정기 진료'));c.append(mk('div','sub',[subtitle,hasVideo?'🎬 초음파 영상':null,legacy.has(date)?'📖 기존 정식 리포트':null].filter(Boolean).join(' · ')));a.append(c,mk('span','arrow','›'));host.append(a)}
async function load(){const res=await fetch('https://bomi-v4.jinihori.workers.dev/api/public/state?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('진료기록 서버 연결 실패');const state=await res.json();const records=Array.isArray(state.records)?state.records:[];const sorted=records.slice().filter(r=>/^\d{4}-\d{2}-\d{2}$/.test(r.visit_date||'')).sort((a,b)=>b.visit_date.localeCompare(a.visit_date));host.replaceChildren();sorted.forEach(r=>item(r.visit_date,r.title,`${r.gestation_week??'-'}주 ${r.gestation_day??0}일 · ${r.hospital||'진료기록'}`,Boolean(r.video_url)||knownVideos.has(r.visit_date)));if(!sorted.some(r=>r.visit_date==='2026-09-18'))item('2026-09-18','9월 18일 초음파 영상','기존 메인에서 보던 영상',true);count.textContent=`총 ${sorted.length}건의 진료기록${sorted.some(r=>r.visit_date==='2026-09-18')?'':' · 별도 영상 1건'}`;if(!host.children.length)count.textContent='등록된 진료기록이 없습니다.'}load().catch(e=>{count.textContent='진료기록을 불러오지 못했습니다.';host.replaceChildren(mk('p','note',e.message+' · 잠시 후 새로고침해 주세요.'))})})();
</script></body></html>
