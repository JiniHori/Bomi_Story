<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8fb">
<title>봄이스토리 · 진료 상세기록</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 10% 10%,#ffe0eb,transparent 35%),radial-gradient(circle at 90% 85%,#d9f7ef,transparent 42%),#fff9fc;color:#573d49;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.panel{width:min(100%,440px);padding:27px 22px;border-radius:24px;background:#fff;border:1px solid #f0dce5;box-shadow:0 12px 30px #b26c891a}h1{font-size:24px;line-height:1.35;margin:8px 0 12px}p{font-size:14px;line-height:1.7;color:#856b79}a{display:flex;align-items:center;justify-content:center;min-height:44px;padding:12px;margin-top:14px;border-radius:14px;background:linear-gradient(120deg,#ffe7ef,#e6faf5);color:#9b4b69;text-decoration:none;font-weight:850;font-size:14px}.small{font-size:12px;color:#9a8490}
</style>
<script>
(() => {
  'use strict';
  // All existing report content continues to be loaded from the unchanged prenatal records API.
  // Only the presentation route is unified, so old bookmarks no longer show broken Drive embeds.
  const date = new URLSearchParams(window.location.search).get('date');
  if (/^\d{4}-\d{2}-\d{2}$/.test(date || '')) {
    window.location.replace('./visit.html?date=' + encodeURIComponent(date));
  }
})();
</script>
</head>
<body><main class="panel"><div style="font-weight:850;font-size:12px;color:#a75e7a">🌸 BOMI STORY</div><h1>진료 상세기록으로 이동합니다</h1><p>기존 진료기록은 그대로 유지되며, 초음파 영상과 상세 리포트는 날짜별 통합 페이지에서 보실 수 있습니다.</p><a id="go" href="./archive.html">전체 진료기록 보기</a><p class="small">자동 이동이 되지 않으면 아래 버튼을 눌러주세요.</p></main><script>
(() => { const d = new URLSearchParams(location.search).get('date'); if (/^\d{4}-\d{2}-\d{2}$/.test(d || '')) { const a = document.getElementById('go'); a.href = './visit.html?date=' + encodeURIComponent(d); a.textContent = '날짜별 상세기록 열기'; } })();
</script></body></html>
