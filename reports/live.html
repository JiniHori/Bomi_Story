<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>봄이 진료기록</title>
<meta name="theme-color" content="#f7dce7">
<style>
:root{
  --bg:#fff8fb;--card:#fffefe;--ink:#523b46;--muted:#927783;
  --mint:#8edfd2;--mint2:#e5faf5;--pink:#bd6685;--yellow:#f3b968;
  --line:#f1dfe6;--shadow:0 16px 38px rgba(176,99,129,.14)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;padding-bottom:34px;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Segoe UI,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 8% 8%,rgba(255,205,224,.5),transparent 23%),
    radial-gradient(circle at 92% 28%,rgba(194,241,230,.55),transparent 25%),
    linear-gradient(180deg,#fff7fa,#f7fffc 54%,#fff)
}
.wrap{max-width:540px;margin:0 auto;padding:22px 16px 46px}
.hero{
  position:relative;overflow:hidden;border:1px solid #fff;border-radius:30px;
  padding:28px 22px;
  background:
    radial-gradient(circle at 88% 4%,rgba(255,205,224,.8),transparent 34%),
    radial-gradient(circle at 5% 0%,rgba(142,223,210,.55),transparent 40%),
    linear-gradient(145deg,#fff,#fff3f7);
  box-shadow:var(--shadow)
}
.hero:after{content:"✿";position:absolute;right:18px;top:18px;color:#fff;font-size:44px;opacity:.72}
.badge{
  display:inline-flex;padding:8px 12px;border-radius:999px;
  background:rgba(255,255,255,.8);color:#a95876;font-size:12px;font-weight:850
}
h1{margin:18px 0 5px;font-size:34px;letter-spacing:-.04em;line-height:1.08}
.sub{color:var(--muted);font-size:14px;line-height:1.6}
.panel{
  margin-top:18px;padding:15px;border-radius:19px;
  background:linear-gradient(135deg,#fff8fb,#f5fffc);
  border:1px solid var(--line)
}
.panel strong{display:block;color:var(--pink);font-size:23px;margin-bottom:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:25px;
  padding:18px;box-shadow:0 10px 26px rgba(143,88,114,.075)
}
.full{grid-column:1/-1}
.card h2{margin:0 0 13px;font-size:20px;letter-spacing:-.03em}
.label{font-size:12px;color:var(--muted);font-weight:850;letter-spacing:.02em}
.value{font-size:22px;font-weight:900;margin-top:5px;letter-spacing:-.03em}
.note,.bodyText{font-size:14px;color:#674b57;line-height:1.68;white-space:pre-line}
.metricNote{font-size:12px;color:var(--muted);line-height:1.5;margin-top:5px}
.metricRow,.statusRow{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  padding:11px 0;border-bottom:1px solid var(--line);font-size:14px
}
.metricRow:last-child,.statusRow:last-child{border-bottom:0}
.metricValue{text-align:right;font-weight:850}
.pill{
  white-space:nowrap;padding:6px 9px;border-radius:999px;
  background:var(--mint2);color:#29786d;font-size:12px;font-weight:900
}
.check{
  display:flex;gap:9px;align-items:flex-start;padding:10px 0;
  border-bottom:1px solid var(--line);font-size:14px;line-height:1.55
}
.check:last-child{border-bottom:0}
.box{
  width:20px;height:20px;flex:0 0 20px;border:2px solid #e3b8c8;
  border-radius:7px;background:#fff;margin-top:1px
}
.video{
  width:100%;display:block;border-radius:18px;background:#3f3038;max-height:380px
}
.linkBtn{
  display:flex;align-items:center;justify-content:center;margin-top:16px;
  padding:13px;border-radius:17px;text-decoration:none;
  background:linear-gradient(135deg,#ffe8f0,#e6faf6);
  color:#8d4964;font-weight:900
}
.warning{
  background:#fff5df;color:#855b19;border-radius:16px;padding:13px;
  font-size:13px;line-height:1.6
}
.footer{text-align:center;color:#ae8e9b;font-size:12px;line-height:1.55;margin-top:20px}
.hidden{display:none!important}
@media(max-width:390px){.grid{grid-template-columns:1fr}.full{grid-column:auto}h1{font-size:30px}}
</style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <div class="badge">🌸 BOMI PREGNANCY JOURNAL</div>
    <h1 id="title">진료기록을 불러오는 중</h1>
    <div class="sub" id="subtitle">잠시만 기다려 주세요.</div>
    <div class="panel">
      <strong id="focus">실시간 기록 연결</strong>
      <div class="note" id="summary">V4 데이터베이스의 기록을 기존 봄이스토리 디자인으로 표시합니다.</div>
    </div>
  </section>

  <section class="grid" id="content">
    <article class="card">
      <div class="label">임신 주수</div>
      <div class="value" id="gestation">-</div>
      <div class="metricNote">진료일 기준</div>
    </article>
    <article class="card">
      <div class="label">병원</div>
      <div class="value" id="hospital">-</div>
      <div class="metricNote" id="status">진료기록</div>
    </article>

    <article class="card full hidden" id="metricsCard">
      <h2>핵심 정보</h2>
      <div id="metrics"></div>
    </article>

    <article class="card full hidden" id="detailsCard">
      <h2>상세 기록</h2>
      <div class="bodyText" id="details"></div>
    </article>

    <article class="card full hidden" id="scheduleCard">
      <h2>다음 일정</h2>
      <div class="bodyText" id="schedule"></div>
    </article>

    <article class="card full hidden" id="checklistCard">
      <h2>체크리스트</h2>
      <div id="checklist"></div>
    </article>

    <article class="card full hidden" id="videoCard">
      <h2>관련 영상</h2>
      <video id="video" class="video" controls playsinline preload="metadata"></video>
    </article>

    <article class="card full hidden" id="errorCard">
      <div class="warning" id="errorMessage"></div>
    </article>
  </section>

  <a class="linkBtn" href="../index.html">← 봄이스토리 홈으로</a>
  <div class="footer">기존 봄이스토리 디자인 · V4 실시간 데이터 연결</div>
</main>

<script>
(() => {
  "use strict";

  const API_URL = "https://bomi-v4.jinihori.workers.dev/api/public/state";
  const params = new URLSearchParams(location.search);
  const targetDate = params.get("date");

  const $ = (id) => document.getElementById(id);
  const show = (id) => $(id).classList.remove("hidden");

  function formatDateKo(value) {
    if (!value) return "";
    const parts = value.split("-");
    return parts.length === 3
      ? `${parts[0]}.${parts[1]}.${parts[2]}`
      : value;
  }

  function setText(id, value, fallback = "-") {
    $(id).textContent = value == null || value === "" ? fallback : String(value);
  }

  function appendMetric(metric) {
    const row = document.createElement("div");
    row.className = "metricRow";

    const left = document.createElement("div");
    const label = document.createElement("div");
    label.textContent = metric.label || "항목";
    left.append(label);

    if (metric.note) {
      const note = document.createElement("div");
      note.className = "metricNote";
      note.textContent = metric.note;
      left.append(note);
    }

    const value = document.createElement("div");
    value.className = "metricValue";
    value.textContent = metric.value || "-";

    row.append(left, value);
    $("metrics").append(row);
  }

  function appendCheck(item) {
    const row = document.createElement("div");
    row.className = "check";

    const box = document.createElement("div");
    box.className = "box";

    const text = document.createElement("div");
    text.textContent = item;

    row.append(box, text);
    $("checklist").append(row);
  }

  function render(record) {
    document.title = `${record.visit_date || ""} ${record.title || "봄이 진료기록"}`;

    setText("title", record.title, "봄이 진료기록");
    setText(
      "subtitle",
      [
        record.hospital,
        formatDateKo(record.visit_date),
        `${record.gestation_week}주 ${record.gestation_day || 0}일`
      ].filter(Boolean).join(" · ")
    );
    setText("focus", record.status === "planned" ? "예정된 진료" : "진료기록");
    setText("summary", record.summary);
    setText("gestation", `${record.gestation_week}주 ${record.gestation_day || 0}일`);
    setText("hospital", record.hospital, "병원 미입력");
    setText("status", record.status === "planned" ? "예정" : "진료 완료");

    if (Array.isArray(record.metrics) && record.metrics.length) {
      record.metrics.forEach(appendMetric);
      show("metricsCard");
    }

    if (record.details) {
      setText("details", record.details);
      show("detailsCard");
    }

    if (record.next_schedule) {
      setText("schedule", record.next_schedule);
      show("scheduleCard");
    }

    if (Array.isArray(record.checklist) && record.checklist.length) {
      record.checklist.forEach(appendCheck);
      show("checklistCard");
    }

    if (record.video_url) {
      $("video").src = record.video_url;
      show("videoCard");
    }
  }

  function showError(message) {
    setText("title", "기록을 불러오지 못했습니다");
    setText("subtitle", targetDate || "날짜 정보 없음");
    setText("focus", "연결 확인 필요");
    setText("summary", "기존 홈 화면으로 돌아가 다시 시도해 주세요.");
    setText("errorMessage", message);
    show("errorCard");
  }

  async function load() {
    if (!targetDate) {
      throw new Error("진료일이 지정되지 않았습니다.");
    }

    const response = await fetch(`${API_URL}?t=${Date.now()}`, {
      cache: "no-store",
      mode: "cors",
      headers: { Accept: "application/json" }
    });

    if (!response.ok) {
      throw new Error(`진료기록 API 오류: ${response.status}`);
    }

    const state = await response.json();
    const records = Array.isArray(state.records) ? state.records : [];
    const record = records.find((item) => item.visit_date === targetDate);

    if (!record) {
      throw new Error(`${targetDate} 진료기록을 찾을 수 없습니다.`);
    }

    render(record);
  }

  load().catch((error) => {
    console.error("[BOMI Live Report]", error);
    showError(error.message || "알 수 없는 오류가 발생했습니다.");
  });
})();
</script>
</body>
</html>
