<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff8fb">
<title>봄이 물품 구매 관리표</title>
<style>
  body{margin:0;background:#fff8fb;color:#523b46;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  main{max-width:720px;margin:0 auto;padding:28px 18px;line-height:1.7}
  .card{background:white;border:1px solid #ecd6df;border-radius:20px;padding:22px;box-shadow:0 12px 28px rgba(176,99,129,.12)}
  h1{font-size:24px;margin:0 0 10px}.muted{color:#806773}.error{color:#b02b47;font-weight:700}
  a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 14px;border:1px solid #ecd6df;border-radius:14px;background:white;color:#523b46;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<main><div class="card"><h1>봄이 물품 구매 관리표를 불러오는 중입니다</h1><p class="muted">최신 GitHub 원본을 봄이스토리 주소 안에서 렌더링합니다. 기존 구매 기록과 동기화 데이터는 이 사이트의 저장소를 그대로 사용합니다.</p><p id="state" class="muted">잠시만 기다려 주세요.</p></div></main>
<script>
(async function(){
  const state=document.getElementById('state');
  const url='https://raw.githubusercontent.com/JiniHori/Bomi_Story/main/supplies.html?ts='+Date.now();
  try{
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok) throw new Error('GitHub 원본 응답 오류 '+res.status);
    const html=await res.text();
    if(!html.includes('봄이 물품 구매 관리표') || !html.includes('sheetWrap')) throw new Error('최신 구매 관리표 원본 확인 실패');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    state.innerHTML='<span class="error">최신 구매 관리표를 불러오지 못했습니다.</span><br>'+String(err.message||err)+'<br><br><a href="https://raw.githubusercontent.com/JiniHori/Bomi_Story/main/supplies.html" target="_blank" rel="noopener">GitHub 원본 열기</a>';
  }
})();
</script>
</body>
</html>
