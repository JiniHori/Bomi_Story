<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>봄이스토리</title>
  <meta name="theme-color" content="#fff7f1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="봄이스토리" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" href="/apple-touch-icon.png" />
  <style>
    :root {
      --bg: #fff7f1;
      --card: #ffffff;
      --ink: #4c3b3b;
      --muted: #8b7474;
      --line: #f1ded8;
      --pink: #f2a6b3;
      --pink-dark: #d97a8b;
      --cream: #fff0e6;
      --mint: #eaf7ef;
      --blue: #eff5ff;
      --shadow: 0 14px 34px rgba(139, 91, 91, .12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      background: radial-gradient(circle at top, #fffdf9 0%, var(--bg) 42%, #fff4f6 100%);
      color: var(--ink);
      min-height: 100vh;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      padding: 18px 16px 96px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 24px 20px;
      border-radius: 30px;
      background: linear-gradient(145deg, #ffffff 0%, #fff3ec 54%, #ffeef3 100%);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.7);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 160px;
      height: 160px;
      right: -56px;
      top: -46px;
      background: rgba(242,166,179,.24);
      border-radius: 50%;
    }

    .eyebrow {
      font-size: 13px;
      color: var(--pink-dark);
      font-weight: 700;
      letter-spacing: .02em;
    }

    h1 {
      margin: 8px 0 4px;
      font-size: 30px;
      line-height: 1.15;
      letter-spacing: -.03em;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .status-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 10px;
      margin-top: 18px;
      position: relative;
      z-index: 1;
    }

    .status {
      padding: 14px;
      border-radius: 22px;
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(241,222,216,.75);
    }

    .status strong {
      display: block;
      font-size: 24px;
      letter-spacing: -.03em;
    }

    .status span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 18px 0 12px;
      position: sticky;
      top: 8px;
      z-index: 10;
    }

    .menu button {
      border: 1px solid rgba(241,222,216,.9);
      background: rgba(255,255,255,.82);
      backdrop-filter: blur(14px);
      border-radius: 18px;
      padding: 11px 6px;
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 8px 22px rgba(139,91,91,.08);
    }

    .menu button.active {
      color: white;
      border-color: var(--pink);
      background: linear-gradient(135deg, var(--pink), #e8909f);
    }

    .section { display: none; }
    .section.active { display: block; }

    .card {
      background: rgba(255,255,255,.86);
      border: 1px solid rgba(241,222,216,.86);
      border-radius: 26px;
      padding: 18px;
      margin-top: 14px;
      box-shadow: 0 10px 26px rgba(139,91,91,.08);
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 18px;
      letter-spacing: -.02em;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }

    .row:last-child { border-bottom: 0; }
    .row b { white-space: nowrap; }
    .row span { color: var(--muted); text-align: right; }

    textarea, input[type="date"], select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 13px 14px;
      background: #fffdfb;
      color: var(--ink);
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 116px;
      resize: vertical;
      line-height: 1.55;
    }

    label {
      display: block;
      margin: 14px 0 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .primary {
      width: 100%;
      margin-top: 14px;
      border: 0;
      border-radius: 18px;
      padding: 14px;
      background: linear-gradient(135deg, var(--pink), #e38c9a);
      color: white;
      font-size: 16px;
      font-weight: 800;
      box-shadow: 0 10px 22px rgba(217,122,139,.22);
    }

    .secondary {
      width: 100%;
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 13px;
      background: #fffdfb;
      color: var(--ink);
      font-size: 15px;
      font-weight: 800;
    }

    .note-item {
      padding: 14px;
      border-radius: 20px;
      background: #fffaf7;
      border: 1px solid var(--line);
      margin-top: 10px;
    }

    .note-meta {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
      gap: 10px;
    }

    .note-text {
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 14px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--cream);
      color: var(--pink-dark);
      font-size: 12px;
      font-weight: 800;
    }

    .empty, .hint, .msg {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .quick {
      padding: 14px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: #fffdfb;
      font-weight: 800;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <div class="eyebrow">BOMI STORY · V3.1</div>
      <h1>봄이스토리</h1>
      <p class="sub">오늘 기준 임신 주수와 진료 기록을 자동으로 정리합니다.</p>

      <div class="status-grid">
        <div class="status">
          <strong><span id="weekDayText">계산 중</span></strong>
          <span>오늘 기준 주수</span>
        </div>
        <div class="status">
          <strong id="dDayText">D-</strong>
          <span>출산예정일까지</span>
        </div>
      </div>
    </section>

    <nav class="menu" aria-label="봄이스토리 메뉴">
      <button class="active" data-tab="home">홈</button>
      <button data-tab="visit">진료</button>
      <button data-tab="letter">한마디</button>
      <button data-tab="archive">기록</button>
    </nav>

    <section id="home" class="section active">
      <div class="card">
        <h2>👶 오늘의 봄이</h2>
        <div class="row"><b>출산예정일</b><span>2027.01.06</span></div>
        <div class="row"><b>임신 경과</b><span id="progressText">계산 중</span></div>
        <div class="row"><b>오늘 날짜</b><span id="todayText">-</span></div>
      </div>

      <div class="card">
        <h2>바로가기</h2>
        <div class="quick-grid">
          <button class="quick" onclick="openTab('visit')">🩺 진료 기록</button>
          <button class="quick" onclick="openTab('letter')">💌 한마디 쓰기</button>
          <button class="quick" onclick="loadNotes(); openTab('archive')">📖 저장 기록</button>
          <button class="quick" onclick="window.scrollTo({top:0,behavior:'smooth'})">⬆️ 상단으로</button>
        </div>
      </div>
    </section>

    <section id="visit" class="section">
      <div class="card">
        <h2>🩺 진료일 설정</h2>
        <label for="visitDate">진료일</label>
        <input id="visitDate" type="date" />
        <p class="hint">진료일을 기준으로 엄마/아빠 한마디가 함께 저장됩니다.</p>
      </div>
    </section>

    <section id="letter" class="section">
      <div class="card">
        <h2>💌 오늘의 한마디</h2>
        <label for="author">작성자</label>
        <select id="author">
          <option value="엄마">엄마</option>
          <option value="아빠">아빠</option>
          <option value="봄이에게">봄이에게</option>
        </select>

        <label for="message">남기고 싶은 말</label>
        <textarea id="message" placeholder="오늘 진료에서 느낀 마음을 남겨주세요."></textarea>

        <button class="primary" onclick="saveNote()">D1에 저장하기</button>
        <button class="secondary" onclick="loadNotes(); openTab('archive')">저장 기록 보기</button>
        <p id="saveMsg" class="msg"></p>
      </div>
    </section>

    <section id="archive" class="section">
      <div class="card">
        <h2>📖 저장된 기록</h2>
        <div class="pill" id="archiveVisitDate">진료일 기준</div>
        <div id="notesList" style="margin-top:12px;"></div>
        <button class="secondary" onclick="loadNotes()">새로고침</button>
      </div>
    </section>
  </main>

  <script>
    const DUE_DATE = new Date("2027-01-06T00:00:00+09:00");
    const PREGNANCY_DAYS = 280;
    const conceptionDate = new Date(DUE_DATE);
    conceptionDate.setDate(conceptionDate.getDate() - PREGNANCY_DAYS);

    function pad(n) { return String(n).padStart(2, "0"); }
    function toDateInputValue(date) {
      return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;
    }
    function formatKoDate(date) {
      return `${date.getFullYear()}.${pad(date.getMonth()+1)}.${pad(date.getDate())}`;
    }

    function updatePregnancyStatus() {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const conception = new Date(conceptionDate.getFullYear(), conceptionDate.getMonth(), conceptionDate.getDate());
      const due = new Date(DUE_DATE.getFullYear(), DUE_DATE.getMonth(), DUE_DATE.getDate());
      const diffDays = Math.max(0, Math.floor((today - conception) / 86400000));
      const week = Math.floor(diffDays / 7);
      const day = diffDays % 7;
      const dday = Math.ceil((due - today) / 86400000);

      document.getElementById("weekDayText").textContent = `${week}주 ${day}일`;
      document.getElementById("dDayText").textContent = dday >= 0 ? `D-${dday}` : `D+${Math.abs(dday)}`;
      document.getElementById("progressText").textContent = `${diffDays}일 경과 / 280일 기준`;
      document.getElementById("todayText").textContent = formatKoDate(today);

      const visitDate = document.getElementById("visitDate");
      if (!visitDate.value) visitDate.value = toDateInputValue(today);
    }

    function openTab(tabId) {
      document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
      document.querySelectorAll(".menu button").forEach(b => b.classList.remove("active"));
      document.getElementById(tabId).classList.add("active");
      document.querySelector(`.menu button[data-tab="${tabId}"]`).classList.add("active");
      if (tabId === "archive") loadNotes();
    }

    document.querySelectorAll(".menu button").forEach(button => {
      button.addEventListener("click", () => openTab(button.dataset.tab));
    });

    async function saveNote() {
      const visitDate = document.getElementById("visitDate").value;
      const author = document.getElementById("author").value;
      const message = document.getElementById("message").value.trim();
      const saveMsg = document.getElementById("saveMsg");

      if (!visitDate) {
        saveMsg.textContent = "진료일을 먼저 선택해 주세요.";
        return;
      }
      if (!message) {
        saveMsg.textContent = "한마디 내용을 입력해 주세요.";
        return;
      }

      saveMsg.textContent = "저장 중입니다.";
      try {
        const res = await fetch("/api/notes", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ visit_date: visitDate, author, message })
        });
        if (!res.ok) throw new Error("save failed");
        document.getElementById("message").value = "";
        saveMsg.textContent = "저장되었습니다.";
        await loadNotes();
      } catch (err) {
        saveMsg.textContent = "저장 실패: Cloudflare D1 연결 상태를 확인해 주세요.";
      }
    }

    async function loadNotes() {
      const visitDate = document.getElementById("visitDate").value;
      const list = document.getElementById("notesList");
      document.getElementById("archiveVisitDate").textContent = `진료일 ${visitDate || "전체"}`;
      list.innerHTML = `<p class="empty">불러오는 중입니다.</p>`;
      try {
        const url = visitDate ? `/api/notes?visit_date=${encodeURIComponent(visitDate)}` : "/api/notes";
        const res = await fetch(url);
        if (!res.ok) throw new Error("load failed");
        const data = await res.json();
        const notes = data.notes || [];
        if (!notes.length) {
          list.innerHTML = `<p class="empty">아직 저장된 한마디가 없습니다.</p>`;
          return;
        }
        list.innerHTML = notes.map(note => `
          <article class="note-item">
            <div class="note-meta">
              <strong>${escapeHtml(note.author)}</strong>
              <span>${escapeHtml(note.visit_date)}</span>
            </div>
            <div class="note-text">${escapeHtml(note.message)}</div>
          </article>
        `).join("");
      } catch (err) {
        list.innerHTML = `<p class="empty">기록을 불러오지 못했습니다. Worker API와 D1 설정을 확인해 주세요.</p>`;
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    updatePregnancyStatus();
    loadNotes();
  </script>
</body>
</html>
